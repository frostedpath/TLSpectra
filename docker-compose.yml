version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECUREMAILSCOPE_TOKEN=sms_sec_token_v1
      - DATABASE_URL=sqlite:////app/storage/securemailscope.db
    volumes:
      - sms_storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sms_storage:
